name: "publish to GitHub Packages"

on:
  push:
    branches:
      - main
      - 'fix/**'
  workflow_dispatch:

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  publish-github-packages:
    name: "publish to GitHub npm registry"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        registry-url: 'https://npm.pkg.github.com'
        scope: '@lockin-bot'

    - name: Configure npm for GitHub Packages
      run: |
        echo "@lockin-bot:registry=https://npm.pkg.github.com" >> .npmrc
        echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" >> .npmrc

    - name: Install dependencies
      run: npm ci
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build packages
      run: npm run build

    - name: Update package scopes
      run: |
        # Update all package names and dependencies to use @lockin-bot scope
        PACKAGES=$(node ./utils/workspace.js --list-public-package-paths)

        # First pass: update all package names
        echo "$PACKAGES" | while read package; do
          cd "$package"
          PACKAGE_NAME=$(node -e 'console.log(require("./package.json").name)')
          if [[ "$PACKAGE_NAME" != @lockin-bot/* ]]; then
            # Remove @playwright/ scope if present, then add @lockin-bot/
            BASE_NAME="${PACKAGE_NAME#@playwright/}"
            SCOPED_NAME="@lockin-bot/${BASE_NAME}"
            echo "Updating package name: ${PACKAGE_NAME} -> ${SCOPED_NAME}"
            npm pkg set name="${SCOPED_NAME}"
          fi
          cd - > /dev/null
        done

        # Second pass: update all dependencies to scoped versions
        echo "$PACKAGES" | while read package; do
          cd "$package"

          # Update dependencies
          DEPS=$(node -e 'const p = require("./package.json"); console.log(Object.keys(p.dependencies || {}).join(" "))')
          for dep in $DEPS; do
            if [[ "$dep" == playwright* ]] || [[ "$dep" == @playwright/* ]] || [[ "$dep" == html-reporter ]] || [[ "$dep" == recorder ]] || [[ "$dep" == trace-viewer ]]; then
              # Remove @playwright/ scope if present
              BASE_DEP="${dep#@playwright/}"
              SCOPED_DEP="@lockin-bot/${BASE_DEP}"
              echo "  Updating dependency: ${dep} -> ${SCOPED_DEP}"
              VERSION=$(npm pkg get "dependencies.${dep}" | tr -d '"')
              npm pkg delete "dependencies.${dep}"
              npm pkg set "dependencies.${SCOPED_DEP}=${VERSION}"
            fi
          done

          # Update optionalDependencies
          OPT_DEPS=$(node -e 'const p = require("./package.json"); console.log(Object.keys(p.optionalDependencies || {}).join(" "))')
          for dep in $OPT_DEPS; do
            if [[ "$dep" == playwright* ]] || [[ "$dep" == @playwright/* ]] || [[ "$dep" == html-reporter ]] || [[ "$dep" == recorder ]] || [[ "$dep" == trace-viewer ]]; then
              # Remove @playwright/ scope if present
              BASE_DEP="${dep#@playwright/}"
              SCOPED_DEP="@lockin-bot/${BASE_DEP}"
              echo "  Updating optionalDependency: ${dep} -> ${SCOPED_DEP}"
              VERSION=$(npm pkg get "optionalDependencies.${dep}" | tr -d '"')
              npm pkg delete "optionalDependencies.${dep}"
              npm pkg set "optionalDependencies.${SCOPED_DEP}=${VERSION}"
            fi
          done

          cd - > /dev/null
        done

    - name: Publish packages
      run: |
        # Get version and add prerelease tag
        VERSION=$(node -e 'console.log(require("./package.json").version)')
        BRANCH=${GITHUB_REF#refs/heads/}
        TIMESTAMP=$(date +%Y%m%d%H%M%S)

        # Update version to include branch and timestamp
        NEW_VERSION="${VERSION}-${BRANCH//\//-}.${TIMESTAMP}"

        echo "Publishing version ${NEW_VERSION} from branch ${BRANCH}"

        # Publish in dependency order: core first, then everything else
        # Core packages (no playwright dependencies)
        CORE_PACKAGES="playwright-core html-reporter recorder trace-viewer web"

        # Publish core packages first
        for pkg in $CORE_PACKAGES; do
          PACKAGE_PATH="packages/$pkg"
          if [ -d "$PACKAGE_PATH" ] && [ -f "$PACKAGE_PATH/package.json" ]; then
            cd "$PACKAGE_PATH"
            PACKAGE_NAME=$(node -e 'console.log(require("./package.json").name)')
            echo "Publishing core package: $PACKAGE_NAME"

            # Set version
            npm version "${NEW_VERSION}" --no-git-tag-version

            # Publish (skip validation to avoid dependency resolution)
            npm publish --access=public --tag=next --no-git-checks || echo "Failed to publish $PACKAGE_NAME"

            cd - > /dev/null
          fi
        done

        # Publish remaining packages
        node ./utils/workspace.js --list-public-package-paths | while read package; do
          PACKAGE_DIR=$(basename "$package")
          # Skip if already published as core package
          if [[ " $CORE_PACKAGES " =~ " $PACKAGE_DIR " ]]; then
            continue
          fi

          cd "$package"
          PACKAGE_NAME=$(node -e 'console.log(require("./package.json").name)')
          echo "Publishing: $PACKAGE_NAME"

          # Set version
          npm version "${NEW_VERSION}" --no-git-tag-version

          # Publish (skip validation to avoid dependency resolution)
          npm publish --access=public --tag=next --no-git-checks || echo "Failed to publish $PACKAGE_NAME"

          cd - > /dev/null
        done
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
